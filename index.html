<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batata Hub - Sistema de Licença Única</title>
    <style>
        body {
            background-color: #0c0c0e;
            color: #e6e6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #121316;
            border: 2px solid #00a08c;
            border-radius: 12px;
            padding: 30px;
            width: 380px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 160, 140, 0.2);
        }
        h1 {
            color: #00c8aa;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .key-box {
            background-color: #16181c;
            border: 1px solid #3c414b;
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #ffc832;
            letter-spacing: 1px;
            margin-bottom: 20px;
            word-break: break-all;
            display: none;
        }
        .btn {
            background-color: #181c20;
            color: #00c8aa;
            border: 1px solid #00a08c;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .btn:hover {
            background-color: #00a08c;
            color: #0c0c0e;
        }
        .btn-copy {
            background-color: #00a08c;
            color: #0c0c0e;
            display: none;
        }
        .info {
            font-size: 12px;
            color: #8a8a93;
            margin-top: 15px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Batata Hub Licença</h1>
    
    <button class="btn" id="btnRedirect" onclick="redirectToYoutube()">1. Assistir Vídeo & Liberar Key</button>
    
    <div class="key-box" id="keyContainer">BTH-LOADING...</div>
    <button class="btn btn-copy" id="btnCopy" onclick="copyKey()">2. Copiar Licença Gerada</button>
    
    <div class="info" id="infoText">Clique no botão acima para apoiar o canal e gerar uma licença totalmente exclusiva e aleatória.</div>
</div>

<script>
    const YOUTUBE_URL = "https://www.youtube.com/watch?v=xNr8qxxMDtE";

    function generateUniqueKey() {
        // Geramos dois fatores numéricos altamente aleatórios
        const token1 = Math.floor(Math.random() * 89999) + 10000; // 5 dígitos
        const token2 = Math.floor(Math.random() * 89999) + 10000; // 5 dígitos
        
        // Obfuscamos os valores somando com chaves fixas conhecidas pelo Roblox
        const part1 = (token1 + 3541).toString(16).toUpperCase();
        const part2 = (token2 + 6824).toString(16).toUpperCase();
        
        // Criamos a assinatura de validação cruzada baseada na soma dos tokens
        const checkSum = ((token1 + token2) * 4).toString(16).toUpperCase();

        return `BTH-${part1}-${part2}-${checkSum}`;
    }

    function redirectToYoutube() {
        window.open(YOUTUBE_URL, '_blank');
        
        document.getElementById('btnRedirect').style.display = 'none';
        
        const generatedKey = generateUniqueKey();
        const keyContainer = document.getElementById('keyContainer');
        const btnCopy = document.getElementById('btnCopy');
        const infoText = document.getElementById('infoText');
        
        keyContainer.innerText = generatedKey;
        keyContainer.style.display = 'block';
        btnCopy.style.display = 'block';
        infoText.innerHTML = "<strong>Sua key individual foi gerada!</strong> Ela é única, aleatória e funcional.";
    }

    function copyKey() {
        const keyText = document.getElementById('keyContainer').innerText;
        navigator.clipboard.writeText(keyText).then(() => {
            const btn = document.getElementById('btnCopy');
            btn.innerText = "Copiado com Sucesso!";
            btn.style.backgroundColor = "#28a745";
            btn.style.color = "#ffffff";
            btn.style.border = "1px solid #28a745";
            setTimeout(() => { 
                btn.innerText = "2. Copiar Licença Gerada"; 
                btn.style.backgroundColor = "#00a08c";
                btn.style.color = "#0c0c0e";
                btn.style.border = "none";
            }, 2000);
        });
    }
</script>

</body>
</html>
