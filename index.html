<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batata Hub - Sistema de Keys</title>
    <style>
        body {
            background-color: #0a0c10;
            color: #d7e6f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #0f1115;
            border: 2px solid #00f0ff;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            width: 350px;
        }
        h1 {
            color: #00f0ff;
            margin-top: 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: #5a6978;
            font-size: 14px;
        }
        .key-box {
            background-color: #090a0d;
            border: 1px solid #282d37;
            border-radius: 6px;
            padding: 12px;
            font-size: 18px;
            font-family: monospace;
            color: #fff;
            margin: 20px 0;
            word-break: break-all;
        }
        button {
            background-color: #14181e;
            border: 1.5px solid #00f0ff;
            color: #00f0ff;
            border-radius: 6px;
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-transform: uppercase;
        }
        button:hover {
            background-color: #00f0ff;
            color: #0a0c10;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💥 Batata Hub</h1>
    <p>Gere sua chave de acesso diária abaixo:</p>
    <div class="key-box" id="keyDisplay">Clique para gerar...</div>
    <button onclick="gerarECopiarKey()">Gerar e Copiar Key</button>
</div>

<script>
function gerarECopiarKey() {
    const data = new Date();
    const dia = data.getDate();
    const mes = data.getMonth() + 1; // Janeiro é 0
    
    // Lógica matemática para mascarar a data e criar o padrão da chave
    const cod1 = (dia * 7 + 123).toString(16).toUpperCase();
    const cod2 = (mes * 13 + 456).toString(16).toUpperCase();
    const hashDia = ((dia + mes) * 42).toString();
    
    // Formato final da Key (Ex: BTH-A5-B3F-84)
    const keyGerada = `BTH-${cod1}-${cod2}-${hashDia}`;
    
    // Exibe na tela
    document.getElementById('keyDisplay').innerText = keyGerada;
    
    // Copia para a área de transferência
    navigator.clipboard.writeText(keyGerada);
    alert('Sua Key diária foi gerada e copiada com sucesso!');
}
</script>

</body>
</html>
